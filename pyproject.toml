[build-system]
requires = [
    "setuptools>=75.8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "test-case-purification"
version = "0.0.1"
authors = [
    { name = "Marius Smytzek", email = "marius.smytzek@cispa.de" },
]
description = "TCP: Reimplementation of Test Case Purification for Improving Fault Localization for Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing"
]
dependencies = []

[project.scripts]
tcp = "tcp.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-html>=4.2.0",
    "pytest-cov>=7.0.0"
]

[tool.black]
line-length = 88
target-version = ['py310']
